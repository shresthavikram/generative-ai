<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Always On Memory Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0f; color: #e8e8e8; }
    </style>
</head>
<body class="font-sans flex items-center justify-center h-screen">
    <div class="max-w-md w-full p-8 bg-[#08080d] border border-gray-800 rounded-2xl shadow-2xl">
        <header class="text-center mb-8">
            <span class="text-5xl">🧠</span>
            <h1 class="text-2xl font-bold mt-4 mb-2 bg-gradient-to-r from-[#c4b5fd] to-[#93c5fd] bg-clip-text text-transparent">
                Memory Agent Login
            </h1>
            <p class="text-gray-500 text-sm">Please sign in to access your memory</p>
        </header>

        {% if error %}
        <div class="bg-red-900/20 border border-red-900/50 text-red-500 text-sm p-3 rounded-lg mb-6">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-4">
                <label for="username" class="block text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">Username</label>
                <input type="text" name="username" id="username" required
                    class="w-full bg-[#12121a] border border-gray-800 rounded-lg p-3 focus:ring-2 focus:ring-[#c4b5fd] outline-none text-white">
            </div>
            <div class="mb-8">
                <label for="password" class="block text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">Password</label>
                <input type="password" name="password" id="password" required
                    class="w-full bg-[#12121a] border border-gray-800 rounded-lg p-3 focus:ring-2 focus:ring-[#c4b5fd] outline-none text-white">
            </div>
            <button type="submit"
                class="w-full bg-[#c4b5fd] text-black font-bold py-3 rounded-lg hover:bg-[#b3a0f0] transition-colors shadow-lg shadow-[#c4b5fd]/10">
                Sign In
            </button>
        </form>

        <p class="text-center text-[10px] text-gray-600 mt-8 uppercase tracking-[0.2em]">
            Admin: admin / password
        </p>
    </div>
</body>
</html>
